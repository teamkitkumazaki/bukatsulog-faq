<body class="">
	<header class="underpage">
		<div class="header_inner">
			<div class="header_logo">
				<a href="/">
					<img src="../assets/img/common/service_logo.svg">
				</a>
			</div>
		</div><!-- header_inner -->
	</header>

	<article id="contact" class="page-contact">
		<section class="section-underpage">
			<div class="section_inner">
				<div class="comp-section-ttl">
					<hgroup>
						<span class="ttl_en">Contact</span>
						<h1 class="ttl_ja">お問い合わせ</h1>
					</hgroup>
				</div>
				<div id="contactWrap" class="comp-form-wrap">
          <div class="form_item">
            <div class="label_wrap">
              <label class="">お名前</label>
              <span class="required">必須</span>
            </div>
            <div class="form_box">
              <div class="name_wrap">
                <input type="text" name="yourname" placeholder="山田太郎" class="bg" data-is-success="false">
              </div>
            </div>
          </div>
          <div class="form_item">
            <div class="label_wrap">
              <label class="">所属チーム名</label>
              <span class="required">必須</span>
            </div>
            <div class="form_box">
              <input class="bg" type="text" name="corpname" placeholder="アジア・グロース・システム株式会社" data-is-success="true">
            </div>
          </div>
          <div class="form_item b_none">
            <div class="label_wrap">
              <label class="">お問い合わせ内容</label>
              <span class="required">必須</span>
            </div>
            <div class="form_box">
              <textarea name="content" class="bg" data-is-success="false"></textarea>
            </div>
          </div>
          <div id="ajaxLoader" class="ajax_loader">
            <span class="loading"></span>
          </div>
          <div id="statusMessage" class="status_message hidden"></div>
          <div id="submitButton" class="submit_wrap">
            <span class="text_wrap">
              <span class="ja"><span class="">内容を送信</span></span>
              <input type="button" value="内容を送信" class="ga_contact">
            </span>
          </div>
        </div>
			</div><!-- section_inner -->
		</section>
	</article>

</body>
<script type="text/javascript" src="../assets/js/layout.js?ver20241002"></script>

</html>
